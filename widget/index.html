<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://pactometro.es; font-src 'self'; connect-src 'self' https://script.google.com https://script.googleusercontent.com; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'; worker-src 'none'">

<meta name="robots" content="noindex">
<title>Pactómetro · pactómetro.es</title>
<link rel="canonical" href="https://pactometro.es/">
<style>
@font-face{font-family:'Archivo';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(/fonts/archivo-latin-wdth-normal.woff2) format('woff2');unicode-range:U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD}
@font-face{font-family:'Archivo';font-style:normal;font-display:swap;font-weight:100 900;font-stretch:62% 125%;src:url(/fonts/archivo-latin-ext-wdth-normal.woff2) format('woff2');unicode-range:U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF}
:root{--ink:#051e3e;--ink-2:#3c4a5f;--muted:#5b6676;--rule:#d7dde6;--sheet:#ffffff;--wash:#eef1f5;--empty:#e1e6ee}
@media (prefers-color-scheme:dark){:root{--ink:#e8edf5;--ink-2:#c3cbd8;--muted:#9aa5b5;--rule:#2c3a50;--sheet:#0d1a2e;--wash:#14243b;--empty:#24344c}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--sheet);color:var(--ink);font:15px/1.45 Archivo,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
a{color:inherit}
.w{padding:14px 16px 12px;display:grid;gap:10px;max-width:760px;margin:0 auto}
.w-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.w-t{margin:0;font-weight:700;font-size:17px;line-height:1.25}
h1.w-t{font-family:inherit}
.w-s{margin:2px 0 0;font-size:13px;color:var(--muted)}
.w-marca{font-weight:800;font-size:13px;text-decoration:none;white-space:nowrap;border:1px solid var(--rule);border-radius:999px;padding:4px 10px}
.w-marca:hover{border-color:var(--ink)}
.w-hemi svg{display:block;width:100%;height:auto;max-height:300px}
.w-hemi text{font-family:Archivo,Arial,sans-serif;fill:var(--ink)}
.w-fig{display:flex;flex-wrap:wrap;gap:6px 18px;align-items:baseline;font-size:14px;color:var(--ink-2)}
.w-fig b{color:var(--ink);font-size:18px;font-variant-numeric:tabular-nums}
.w-ver{font-weight:700;color:var(--ink);border:1.5px solid var(--ink);border-radius:999px;padding:3px 10px;font-size:13px}
.w-ver.on{background:var(--ink);color:var(--sheet)}
.w-ley{display:flex;flex-wrap:wrap;gap:5px;margin:0;padding:0;list-style:none}
.w-ley li{display:inline-flex;align-items:center;gap:5px;font-size:13px;font-weight:600;border-radius:999px;padding:3px 9px 3px 6px;background:var(--wash)}
.w-ley li.fuera{font-weight:500;color:var(--muted)}
.w-ley li.fuera i{opacity:.35}
.w-ley i{width:9px;height:9px;border-radius:50%;display:inline-block}
.w-pie{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--rule);padding-top:8px}
.w-pie a{font-weight:700;color:var(--ink)}
.w-cargando,.w-error{color:var(--muted);padding:24px 0;margin:0}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px;border-radius:3px}
</style>
</head>
<body>
<main class="w" id="w"><p class="w-cargando">Cargando el pactómetro…</p></main>
<script src="/config.js"></script>
<script src="/widget/widget.js"></script>
</body>
</html>
